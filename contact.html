    <h3><u>Question Form:</u></h3>
    <form id="form">
        <div class="name">
            <label>Name:<input type="text" name="name" placeholder="First Name" value="Jane Doe" /></label>
        </div>
    <br>
        <div class="email">
            <label>Email:<input type="email" id="email" name="email" placeholder="Email" value="jane.doe@example.com" /></label>
        </div>
    <br>
        <div class="confirm-email">
            <label>Confirm Email:<input type="email" id="confirm-email" name="confirm-email" placeholder="Confirm Email" value="jane.doe@example.com" /></label>
        </div>
    <br>
        <div class="tel">
            <label>Telephone Number:<input type="tel" name="phone-number" placeholder="Tel" value="07123456789" /></label>
        </div>
    <br>
      <p>Contact Method:</p>
        <div class="cbx">
            <label>Text<input type="checkbox" name="cbx" value="sms" checked /></label>
            <label>Email<input type="checkbox" name="cbx" value="emails" /></label>
        </div>
    <br><br>
        <div class="date"></div>
            <label>Date of the future project:</label>
            <input type="date" id="birthday" name="birthday" value="2027-01-15">
        </div>
    <br><br>
        <div class="question"></div>
            <label> Any question about future project:</label>
            <textarea name="txtAr" rows="5" cols="60">Inquiry regarding a generic web development project.</textarea>
        </div>
    <br>   
        <div class="submit">
             <input type="submit" name="Submit"/>
        </div>
    </form>
